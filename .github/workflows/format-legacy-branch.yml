name: Format legacy JavaScript once
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/format-legacy-branch.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/format-legacy-javascript'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: chore/format-legacy-javascript
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned formatter
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Format maintained JavaScript
        run: npx prettier --write "**/*.{mjs,js}"
      - name: Commit formatting on dedicated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.mjs' '*.js' 'app/*.js' 'scripts/*.mjs'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize maintained JavaScript with Prettier"
            git push origin HEAD:chore/format-legacy-javascript
          fi
